name: Artifact-Build-DockerfileBase

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: '选择要构建的 Dockerfile'
        required: true
        type: choice
        options:
          - DockerfileBase
          - DockerfileBase3.6
          - DockerfileBase3.9
          - Dockerfile-centos-node
          - DockerfileBase.jetson
      image_tag:
        description: '镜像标签 (如: py311-2026.Q2)'
        required: true
        default: 'py311-2026.Q2'
      image_name:
        description: '导出镜像名称 (如: galileo-icf-base-cpu)'
        required: true
        default: 'galileo-icf-base-cpu'
      platforms:
        description: '目标平台,多个用英文逗号分开 (linux/amd64,linux/arm64)'
        required: true
        default: 'linux/amd64,linux/arm64'
      release_tag:
        description: 'Release 标签名 (如: base-py311-2026.Q2)'
        required: true
        default: 'base-py311-2026.Q2'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker images
        run: |
          IMAGE_NAME="${{ github.event.inputs.image_name }}"
          TAG="${{ github.event.inputs.image_tag }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"
          DOCKERFILE="${{ github.event.inputs.dockerfile }}"

          IFS=',' read -r -a platform_array <<< "$PLATFORMS"
          for platform in "${platform_array[@]}"; do
            arch="${platform##*/}"
            echo "========== Building ${DOCKERFILE} for ${platform} =========="
            docker buildx build \
              --platform "${platform}" \
              --file "${DOCKERFILE}" \
              --tag "${IMAGE_NAME}:${TAG}-${arch}" \
              --output "type=docker,dest=${IMAGE_NAME}-${TAG}-${arch}.tar" \
              .
            echo "========== Compressing ${arch} image =========="
            gzip -c "${IMAGE_NAME}-${TAG}-${arch}.tar" > "${IMAGE_NAME}-${TAG}-${arch}.tar.gz"
            rm -f "${IMAGE_NAME}-${TAG}-${arch}.tar"
          done

      - name: List generated files
        run: ls -lh *.tar.gz

      - name: Generate Release Body
        id: release_body
        run: |
          IMAGE_NAME="${{ github.event.inputs.image_name }}"
          TAG="${{ github.event.inputs.image_tag }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"
          DOCKERFILE="${{ github.event.inputs.dockerfile }}"
          {
            echo "body<<EOF"
            echo "## ICF Base Image Release"
            echo ""
            echo "- **Dockerfile:** \`${DOCKERFILE}\`"
            echo "- **Image name:** \`${IMAGE_NAME}\`"
            echo "- **Image tags:** \`${IMAGE_NAME}:${TAG}-amd64\` / \`${IMAGE_NAME}:${TAG}-arm64\`"
            echo "- **Platforms:** \`${PLATFORMS}\`"
            echo ""
            echo "### 使用方式"
            echo "\`\`\`bash"
            echo "# 导入 amd64 镜像"
            echo "gzip -d ${IMAGE_NAME}-${TAG}-amd64.tar.gz"
            echo "docker load -i ${IMAGE_NAME}-${TAG}-amd64.tar"
            echo ""
            echo "# 导入 arm64 镜像"
            echo "gzip -d ${IMAGE_NAME}-${TAG}-arm64.tar.gz"
            echo "docker load -i ${IMAGE_NAME}-${TAG}-arm64.tar"
            echo "\`\`\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Docker Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.event.inputs.image_tag }}
          path: |
            *.tar.gz
          retention-days: 7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
