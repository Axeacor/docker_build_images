name: Build-Ubuntu1804-Py310

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file DockerfileBase3.10-Ubuntu18.04 \
            --tag ubuntu1804-py310:amd64 \
            --load \
            .
          docker save ubuntu1804-py310:amd64 | gzip > ubuntu1804-py310-amd64.tar.gz

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu1804-py310-${{ github.run_number }}
          name: "ubuntu1804-py310 #${{ github.run_number }}"
          body: |
            Ubuntu 18.04 + Python 3.10 基础镜像

            ```bash
            gzip -d ubuntu1804-py310-amd64.tar.gz
            docker load -i ubuntu1804-py310-amd64.tar
            docker run --rm -it ubuntu1804-py310:amd64 python3.10 --version
            ```
          files: |
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
