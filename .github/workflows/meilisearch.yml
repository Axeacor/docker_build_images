name: Build-Meilisearch-Docker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug - 打印工作目录文件
        run: |
          pwd
          ls -la

      - name: Build Meilisearch Docker image & export offline tar.gz
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file ./Dockerfile.meili \
            --tag meilisearch:v1.24.0-amd64 \
            --load \
            ./
          docker save meilisearch:v1.24.0-amd64 | gzip > meilisearch-v1.24.0-amd64.tar.gz

      - name: Create GitHub Release & Upload offline image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meilisearch-v1.24.0-${{ github.run_number }}
          name: "Meilisearch v1.24.0-amd64 #${{ github.run_number }}"
          body: |
            Meilisearch 离线Docker镜像 amd64，兼容 Alibaba Cloud Linux 3 (GLIBC 2.28)
            ### 内网无外网服务器部署命令
            ```bash
            gzip -d meilisearch-v1.24.0-amd64.tar.gz
            docker load -i meilisearch-v1.24.0-amd64.tar
            mkdir -p /data/meili_data
            docker run -d \
              --name meilisearch \
              -p 7700:7700 \
              -v /data/meili_data:/meili_data \
              -e MEILI_MASTER_KEY=自定义安全密钥 \
              -e MEILI_ENV=production \
              meilisearch:v1.24.0-amd64
