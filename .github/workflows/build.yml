name: Build-Py314-PipBuilder

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标平台 (linux/amd64 或 linux/arm64)'
        required: true
        default: 'linux/amd64'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"
          IFS=',' read -r -a platform_array <<< "$PLATFORMS"
          for platform in "${platform_array[@]}"; do
            arch="${platform##*/}"
            echo "========== Building for ${platform} =========="
            docker buildx build \
              --platform "${platform}" \
              --file Dockerfile-py314-slim \
              --tag py314-builder:${arch} \
              --output "type=docker,dest=py314-builder-${arch}.tar" \
              .
            gzip -c "py314-builder-${arch}.tar" > "py314-builder-${arch}.tar.gz"
            rm -f "py314-builder-${arch}.tar"
          done

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: py314-builder-${{ github.run_number }}
          name: "py314-builder #${{ github.run_number }}"
          body: |
            Python 3.14 pip 下载专用镜像

            ```bash
            gzip -d py314-builder-amd64.tar.gz
            docker load -i py314-builder-amd64.tar
            docker run --rm -v $(pwd)/wheels:/output py314-builder:amd64 pip wheel --wheel-dir=/output <包名>
            ```
          files: |
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
