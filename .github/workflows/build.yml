name: Build-Py314-PipBuilder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file DockerfileBasepy314 \
            --tag py314-builder:amd64 \
            --load \
            .
          docker save py314-builder:amd64 | gzip > py314-builder-amd64.tar.gz

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: py314-builder-${{ github.run_number }}
          name: "py314-builder #${{ github.run_number }}"
          body: |
            Python 3.14 pip builder 镜像（基于 Ubuntu 18.04，GLIBC 2.27 兼容）

            ```bash
            gzip -d py314-builder-amd64.tar.gz
            docker load -i py314-builder-amd64.tar
            docker run --rm -v $(pwd)/wheels:/output py314-builder:amd64 \
              pip wheel --no-binary :all: --wheel-dir=/output <包名>
            ```
          files: |
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
