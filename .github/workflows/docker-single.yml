name: Docker Build - Single

on:
  workflow_dispatch:
    inputs:
      single_image_preset:
        description: '常用镜像；选 custom 时填写 single_image'
        required: true
        type: choice
        default: 'node:22-alpine'
        options:
          - 'node:22-alpine'
          - 'node:22-bookworm-slim'
          - 'node:24-alpine'
          - 'node:24-bookworm-slim'
          - 'python:3.12-slim'
          - 'python:3.12-alpine'
          - 'python:3.13-slim'
          - 'python:3.13-alpine'
          - 'ubuntu:24.04'
          - 'alpine:3.20'
          - custom

      single_image:
        description: '自定义完整镜像名；填写后覆盖 preset'
        required: false
        default: ''

      package_profile:
        description: '系统依赖预设；默认 auto'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - none
          - runtime
          - python-build
          - node-build
          - python-node-build

      install_packages:
        description: '额外系统包；空格/逗号/换行分隔'
        required: false
        default: ''

      python_packages:
        description: '额外 pip 包；空格/逗号/换行分隔'
        required: false
        default: ''

      node_packages:
        description: '额外 npm 全局包；空格/逗号/换行分隔'
        required: false
        default: ''

      image_name:
        description: '输出镜像名称；留空自动从 single_image 生成'
        required: false
        default: ''

      image_tag:
        description: '输出镜像标签；留空自动从 single_image tag 生成'
        required: false
        default: ''

      release_tag:
        description: 'Release 标签名；留空自动用 image_name-image_tag'
        required: false
        default: ''

      build_arm64:
        description: '同时打包 linux/arm64'
        required: true
        type: boolean
        default: false

run-name: Single ${{ inputs.single_image || inputs.single_image_preset }}

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-22.04
    env:
      INPUT_SINGLE_IMAGE_PRESET: ${{ inputs.single_image_preset }}
      INPUT_SINGLE_IMAGE: ${{ inputs.single_image }}
      INPUT_PACKAGE_PROFILE: ${{ inputs.package_profile }}
      INPUT_INSTALL_PACKAGES: ${{ inputs.install_packages }}
      INPUT_PYTHON_PACKAGES: ${{ inputs.python_packages }}
      INPUT_NODE_PACKAGES: ${{ inputs.node_packages }}
      INPUT_IMAGE_NAME: ${{ inputs.image_name }}
      INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
      INPUT_BUILD_ARM64: ${{ inputs.build_arm64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare inputs
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' <<< "$1"
          }

          normalize_list() {
            printf '%s' "$1" | tr ',\r\n' '   ' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]][[:space:]]*/ /g'
          }

          write_env() {
            local name="$1"
            local value="$2"
            {
              echo "${name}<<EOF"
              echo "${value}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          }

          reject_newline() {
            local label="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::${label} 不能包含换行"
              exit 1
            fi
          }

          validate_image_ref() {
            local label="$1"
            local value="$2"
            reject_newline "$label" "$value"
            if [[ -z "$value" || ! "$value" =~ ^[a-z0-9][a-z0-9._/:@-]*$ ]]; then
              echo "::error::${label} 不是有效的 Docker 镜像引用: ${value}"
              exit 1
            fi
          }

          validate_image_name() {
            local value="$1"
            reject_newline "image_name" "$value"
            if [[ -z "$value" || ! "$value" =~ ^[a-z0-9][a-z0-9._:/-]*$ ]]; then
              echo "::error::image_name 不是有效的镜像名: ${value}"
              exit 1
            fi
            local last_segment="${value##*/}"
            if [[ "$last_segment" == *:* ]]; then
              echo "::error::image_name 不要带 tag，请把 tag 填到 image_tag"
              exit 1
            fi
          }

          sanitize_tag() {
            local value="$1"
            value="$(printf '%s' "$value" | sed -E 's#[^A-Za-z0-9_.-]+#-#g; s#^[.-]+##; s#[.-]+$##')"
            if [[ -z "$value" ]]; then
              value="latest"
            fi
            if [[ ! "$value" =~ ^[A-Za-z0-9_] ]]; then
              value="v${value}"
            fi
            printf '%.128s' "$value"
          }

          validate_tag() {
            local label="$1"
            local value="$2"
            reject_newline "$label" "$value"
            if [[ -z "$value" || ! "$value" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::${label} 只能使用 Docker tag 兼容字符: ${value}"
              exit 1
            fi
          }

          validate_release_tag() {
            local value="$1"
            reject_newline "release_tag" "$value"
            if [[ -z "$value" || ! "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::release_tag 不是安全的 Git tag: ${value}"
              exit 1
            fi
          }

          resolve_preset() {
            local preset="$1"
            local custom="$2"
            custom="$(trim "$custom")"
            if [[ -n "$custom" ]]; then
              printf '%s' "$custom"
              return
            fi
            if [[ "$preset" == "custom" || -z "$preset" ]]; then
              echo "::error::选择 custom 时必须填写 single_image" >&2
              exit 1
            fi
            printf '%s' "$preset"
          }

          derive_image_defaults() {
            local ref="$1"
            local no_digest="${ref%%@*}"
            local digest=""
            local repo
            local tag
            local name

            if [[ "$ref" == *@* ]]; then
              digest="${ref#*@}"
            fi

            local last_segment="${no_digest##*/}"
            if [[ "$last_segment" == *:* ]]; then
              tag="${last_segment##*:}"
              repo="${no_digest%:*}"
            else
              tag="latest"
              repo="$no_digest"
            fi

            name="${repo##*/}"
            name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^[._-]+##; s#[._-]+$##')"
            if [[ -z "$name" ]]; then
              name="universal-runtime"
            fi

            if [[ -n "$digest" && "$tag" == "latest" ]]; then
              tag="digest-$(printf '%s' "$digest" | sed -E 's#[^A-Za-z0-9_.-]+#-#g' | cut -c1-48)"
            fi
            tag="$(sanitize_tag "$tag")"

            printf '%s\n%s\n' "$name" "$tag"
          }

          build_platforms() {
            case "$1" in
              true|True|TRUE|1|yes|YES) printf '%s' 'linux/amd64,linux/arm64' ;;
              *) printf '%s' 'linux/amd64' ;;
            esac
          }

          SOURCE_IMAGE="$(resolve_preset "$INPUT_SINGLE_IMAGE_PRESET" "$INPUT_SINGLE_IMAGE")"
          validate_image_ref "single_image" "$SOURCE_IMAGE"

          mapfile -t defaults < <(derive_image_defaults "$SOURCE_IMAGE")
          DEFAULT_IMAGE_NAME="${defaults[0]}"
          DEFAULT_IMAGE_TAG="${defaults[1]}"

          IMAGE_NAME="$(trim "$INPUT_IMAGE_NAME")"
          IMAGE_TAG="$(trim "$INPUT_IMAGE_TAG")"
          RELEASE_TAG="$(trim "$INPUT_RELEASE_TAG")"
          PACKAGE_PROFILE="$(trim "$INPUT_PACKAGE_PROFILE")"
          INSTALL_PACKAGES="$(normalize_list "$INPUT_INSTALL_PACKAGES")"
          PYTHON_PACKAGES="$(normalize_list "$INPUT_PYTHON_PACKAGES")"
          NODE_PACKAGES="$(normalize_list "$INPUT_NODE_PACKAGES")"
          PLATFORMS="$(build_platforms "$INPUT_BUILD_ARM64")"

          if [[ -z "$IMAGE_NAME" ]]; then
            IMAGE_NAME="$DEFAULT_IMAGE_NAME"
          fi
          if [[ -z "$IMAGE_TAG" ]]; then
            IMAGE_TAG="$DEFAULT_IMAGE_TAG"
          else
            IMAGE_TAG="$(sanitize_tag "$IMAGE_TAG")"
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(printf '%s-%s' "$IMAGE_NAME" "$IMAGE_TAG" | sed -E 's#[^A-Za-z0-9._/-]+#-#g; s#^-+|-+$##g')"
          fi

          case "$PACKAGE_PROFILE" in
            auto|none|runtime|python-build|node-build|python-node-build) ;;
            *)
              echo "::error::未知 package_profile: ${PACKAGE_PROFILE}"
              exit 1
              ;;
          esac

          validate_image_name "$IMAGE_NAME"
          validate_tag "image_tag" "$IMAGE_TAG"
          validate_release_tag "$RELEASE_TAG"

          SAFE_FILE_PREFIX="$(printf '%s-%s' "$IMAGE_NAME" "$IMAGE_TAG" | sed -E 's#[^A-Za-z0-9_.-]+#-#g; s#^-+|-+$##g')"

          write_env "FINAL_DOCKERFILE" "Dockerfile.single"
          write_env "FINAL_SOURCE_IMAGE" "$SOURCE_IMAGE"
          write_env "FINAL_IMAGE_NAME" "$IMAGE_NAME"
          write_env "FINAL_IMAGE_TAG" "$IMAGE_TAG"
          write_env "FINAL_RELEASE_TAG" "$RELEASE_TAG"
          write_env "FINAL_PACKAGE_PROFILE" "$PACKAGE_PROFILE"
          write_env "FINAL_INSTALL_PACKAGES" "$INSTALL_PACKAGES"
          write_env "FINAL_PYTHON_PACKAGES" "$PYTHON_PACKAGES"
          write_env "FINAL_NODE_PACKAGES" "$NODE_PACKAGES"
          write_env "FINAL_PLATFORMS" "$PLATFORMS"
          write_env "FINAL_SAFE_FILE_PREFIX" "$SAFE_FILE_PREFIX"

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker images
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r platform; do
            [[ -z "$platform" ]] && continue
            platform_tag="${platform#linux/}"
            platform_tag="${platform_tag//\//-}"
            image_ref="${FINAL_IMAGE_NAME}:${FINAL_IMAGE_TAG}-${platform_tag}"
            archive="${FINAL_SAFE_FILE_PREFIX}-${platform_tag}.tar"

            echo "========== Building ${image_ref} for ${platform} =========="
            docker buildx build \
              --platform "$platform" \
              --file "$FINAL_DOCKERFILE" \
              --build-arg "SOURCE_IMAGE=${FINAL_SOURCE_IMAGE}" \
              --build-arg "PACKAGE_PROFILE=${FINAL_PACKAGE_PROFILE}" \
              --build-arg "INSTALL_PACKAGES=${FINAL_INSTALL_PACKAGES}" \
              --build-arg "PYTHON_PACKAGES=${FINAL_PYTHON_PACKAGES}" \
              --build-arg "NODE_PACKAGES=${FINAL_NODE_PACKAGES}" \
              --tag "$image_ref" \
              --output "type=docker,dest=${archive}" \
              .

            gzip -9c "$archive" > "${archive}.gz"
            rm -f "$archive"
          done < <(printf '%s' "$FINAL_PLATFORMS" | tr ',' '\n')

      - name: Verify generated archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "::error::未生成任何镜像压缩包"
            exit 1
          fi
          ls -lh "${files[@]}"

      - name: Generate release body
        id: release_body
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "body<<EOF"
            echo "## Single Docker Image"
            echo ""
            echo "- Source image: \`${FINAL_SOURCE_IMAGE}\`"
            echo "- Dockerfile: \`${FINAL_DOCKERFILE}\`"
            echo "- Image prefix: \`${FINAL_IMAGE_NAME}:${FINAL_IMAGE_TAG}-<arch>\`"
            echo "- Platforms: \`${FINAL_PLATFORMS}\`"
            echo "- Package profile: \`${FINAL_PACKAGE_PROFILE}\`"
            echo ""
            echo "### Load"
            echo "\`\`\`bash"
            echo "gzip -d <archive>.tar.gz"
            echo "docker load -i <archive>.tar"
            echo "\`\`\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          name: ${{ steps.prepare.outputs.release_tag }}
          body: ${{ steps.release_body.outputs.body }}
          files: |
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Docker Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ steps.prepare.outputs.image_tag }}
          path: |
            *.tar.gz
          retention-days: 7
